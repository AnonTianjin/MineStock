simulation-admin-bounds-order: "<red>✗ 上限必须大于下限</red>  <dark_gray>（收到 </dark_gray><white>{min}</white><dark_gray> ~ </dark_gray><white>{max}</white><dark_gray>）</dark_gray>  <gray>请调高上限或调低下限。</gray>"

# ── GUI 查看 K 线后的返回入口 ───────────────────────────────────────────────────
# 由 GUI 点击"查看K线"时记下的返回指令；一次性消费，回到原界面后即失效。
chart-return-line: "<click:run_command:'{command}'><hover:show_text:'<gray>回到 {label}</gray>'><white>◀ 返回 {label}</white></hover></click>  <dark_gray>（点击执行 {command}）</dark_gray>"

# 没有可返回的目标时（手敲图表命令、或已经返回过一次）。
# 明确说"没有"而不是静默无反应 —— 静默会让玩家以为是插件卡了。
chart-return-none: "<gray>没有可返回的界面。</gray> <dark_gray>从界面点开 K 线后可用 </dark_gray><white>/mstock back</white><dark_gray> 回到原处。</dark_gray>"

# 交易提交后的即时回执：网络取价最坏要等到 HTTP 超时（12 秒），
# 没有这一行玩家会以为"点了没反应"。
trade-processing: "<gray>… 正在处理 </gray><white>{action}</white><gray>，请稍候</gray>"

