name: MineStock
version: '${project.version}'
main: dev.onelili.mstock.MineStock
api-version: '1.20'
folia-supported: true
load: POSTWORLD
authors: [ oneLiLi ]
depend: [ Vault ]
commands:
  mstock:
    description: 股票市场命令
    usage: /mstock [menu|help [页码]|leverage|margin|forex|futures|chart|back|recommended|simulation|<代码>|buy|sell|short|cover|portfolio|positions|pg|reload]
    permission: minestock.use
  stock:
    description: 股票市场命令（/mstock 的别名，行为与原版一致）
    usage: /mstock [menu|help [页码]|leverage|margin|forex|futures|chart|back|recommended|simulation|<代码>|buy|sell|short|cover|portfolio|positions|pg|reload]
    permission: minestock.use
permissions:
  minestock.use:
    description: 允许使用 MineStock 股票市场
    default: true
  minestock.admin:
    description: 允许重载 MineStock 配置
    default: op
  minestock.menu:
    description: 允许打开 MineStock 统一主菜单
    default: true
  minestock.leverage.set:
    description: 允许调整个人杠杆倍数
    default: true
  minestock.forex.trade:
    description: 允许进行外汇买入 / 卖出
    default: true
  minestock.futures.trade:
    description: 允许开仓 / 平仓期货合约
    default: true
  minestock.chart:
    description: 允许在聊天框查看 K 线走势图
    default: true
  minestock.simulation.use:
    description: 允许使用模拟盘行情、交易与持仓
    default: true
  minestock.simulation.admin:
    description: 允许管理模拟盘（价格 / 停牌 / 联动 / 定时等）
    default: op
